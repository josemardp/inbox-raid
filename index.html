<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Inbox Raid</title>
    <meta name="description" content="An arcade raid on your real inbox. Every enemy you kill is an email that really leaves your inbox." />
    <meta name="theme-color" content="#0b0b1e" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 9' shape-rendering='crispEdges'%3E%3Cpath fill='%23ff2e88' d='M2 0h1v1H2zM8 0h1v1H8zM3 1h5v1H3zM2 2h7v1H2zM1 3h2v1H1zM4 3h3v1H4zM8 3h2v1H8zM0 4h11v1H0zM0 5h1v2H0zM2 5h7v1H2zM10 5h1v2h-1zM2 6h1v1H2zM8 6h1v1H8zM3 7h2v1H3zM6 7h2v1H6z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage">
      <header id="hud" hidden>
        <div class="hud-cell hud-inbox">
          <span class="label">INBOX</span>
          <span id="inbox-count" class="big">0</span>
        </div>
        <div class="hud-cell hud-score">
          <span class="label">SCORE</span>
          <span id="score" class="big">0</span>
          <span id="combo" class="combo"></span>
        </div>
        <div class="hud-cell hud-right">
          <span class="label">TIME <b id="time">0:00</b></span>
          <span class="label">STRESS</span>
          <div class="stress"><i id="stress-fill"></i></div>
        </div>
      </header>
      <main id="screen"></main>
      <footer id="controls"></footer>
    </div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="crt" aria-hidden="true"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
