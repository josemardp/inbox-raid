<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Inbox Raid</title>
    <meta name="description" content="An arcade raid on your real inbox. Every enemy you kill is an email that really leaves your inbox." />
    <meta name="theme-color" content="#0a1024" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 9'%3E%3Cg fill='%2375dbf3'%3E%3Ccircle cx='3.5' cy='.5' r='.45'/%3E%3Ccircle cx='5.5' cy='.5' r='.45'/%3E%3Ccircle cx='7.5' cy='.5' r='.45'/%3E%3Ccircle cx='2.5' cy='2.5' r='.45'/%3E%3Ccircle cx='4.5' cy='2.5' r='.45'/%3E%3Ccircle cx='6.5' cy='2.5' r='.45'/%3E%3Ccircle cx='8.5' cy='2.5' r='.45'/%3E%3Ccircle cx='1.5' cy='4.5' r='.45'/%3E%3Ccircle cx='3.5' cy='4.5' r='.45'/%3E%3Ccircle cx='5.5' cy='4.5' r='.45'/%3E%3Ccircle cx='7.5' cy='4.5' r='.45'/%3E%3Ccircle cx='9.5' cy='4.5' r='.45'/%3E%3Ccircle cx='2.5' cy='6.5' r='.45'/%3E%3Ccircle cx='8.5' cy='6.5' r='.45'/%3E%3Ccircle cx='1.5' cy='8.5' r='.45'/%3E%3Ccircle cx='9.5' cy='8.5' r='.45'/%3E%3C/g%3E%3Cg fill='%23ff6e67'%3E%3Ccircle cx='3.5' cy='3.5' r='.5'/%3E%3Ccircle cx='7.5' cy='3.5' r='.5'/%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="stage">
      <header id="hud" hidden>
        <div class="stat score"><span class="label" id="hud-score-label">SCORE</span><strong id="score">0</strong></div>
        <div class="stat time"><span class="label" id="hud-time-label">TIME</span><strong id="time">0:00</strong></div>
      </header>
      <div id="arena">
        <main id="screen"></main>
        <aside id="stack" hidden>
          <figure class="dial"><svg id="dial-inbox" aria-hidden="true"></svg><figcaption id="dial-inbox-label">INBOX</figcaption></figure>
          <div class="gear"><span class="label" id="gear-label">COMBO</span><strong id="combo">x1</strong></div>
          <figure class="dial"><svg id="dial-stress" aria-hidden="true"></svg><figcaption id="dial-stress-label">STRESS</figcaption></figure>
        </aside>
      </div>
      <footer id="controls"></footer>
    </div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
